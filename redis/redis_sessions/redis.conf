# === Сеть и безопасность ===

# Просматриваем всю сеть докера
bind 0.0.0.0

# Порт по умолчанию
port 6379

# Отключаем опасные команды
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# === Память ===

# Ограничиваем занимаемую оперативную память 
maxmemory 256mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# === Сохранение данных на диск === 

# Отключаем автоматические сохранения БД по времени
save ""

# Включаем AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes

# Устанавливаем ограничения для записи на диск
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# === Логи === 

# Устанавливаем режим логов
loglevel warning 
logfile ""

# Отключаем режим демона
daemonize no
