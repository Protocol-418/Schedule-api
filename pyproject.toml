# ============================================== #
# НАСТРОЙКИ PYTEST #
# ============================================== #

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]
markers = [
    "smoke: Дымовые тесты",
    "regression: Регрессионные тесты",
    "slow: Медленные тесты",
]

# ============================================== #
# НАСТРОЙКИ RUFF
# ============================================== #

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "B"]
ignore = ["B008"]
[tool.ruff.lint.per-file-ignores]

"app/db/models/*" = ["F821"]


